.head p{margin:6px 0 0;color:var(--mute);font-size:.95rem;line-height:1.5}
label{display:block;margin-bottom:8px;font-weight:500;font-size:.9rem;color:var(--mute)}
input{width:100%;font:500 1rem var(--ff);color:var(--ink);background:var(--field);border:1px solid var(--line);padding:13px 14px;border-radius:2px}
input::placeholder{color:#6f87c4}
input:focus-visible,button:focus-visible{outline:2px solid #9cc0ff;outline-offset:2px}
button{width:100%;font:600 1rem var(--ff);color:#fff;background:var(--btn);border:0;padding:15px;cursor:pointer;border-radius:2px;transition:background .15s}
button:hover{background:var(--btn-hi)}
.note{margin:10px 0 0;min-height:1.3em;font-size:.88rem;color:var(--mute)}
.frame{position:relative;width:min(100%,720px);aspect-ratio:2000/2200;overflow:hidden;box-shadow:0 10px 50px rgba(0,0,0,.55);background:#00122e}
@media (min-width:1100px){
 main{grid-template-columns:340px minmax(0,1fr);grid-template-areas:"head stage" "field stage" "action stage" "none stage";grid-template-rows:auto auto auto 1fr;column-gap:48px;justify-items:stretch;align-items:start;padding-top:24px}
 .head{grid-area:head}.field{grid-area:field}.action{grid-area:action}
 .frame{grid-area:stage;justify-self:center;width:min(100%,calc((100dvh - 3rem)*2000/2200))}
}
@media (max-width:480px){main{padding:18px 12px 32px}h1{font-size:1.45rem}}
#stage{position:absolute;left:0;top:0;width:2000px;height:2200px;transform-origin:0 0;font-family:var(--ff);color:#fff}
#stage img{position:absolute;display:block;user-select:none;-webkit-user-drag:none}
#ttl{position:absolute;left:250px;top:349px;width:1500px;height:100px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:500;line-height:1}
.cell{position:absolute;width:287px;height:287px;border:4px solid var(--line);background:rgba(30,100,255,.18);display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden;cursor:text}
.cell:focus-within{border-color:#9cc0ff;background:rgba(60,130,255,.3)}
.t{outline:none;max-width:100%;text-align:center;font-weight:500;line-height:1.2;word-break:break-word;caret-color:#fff}
.t:empty::before{content:"Texto";opacity:.5}
dialog{max-width:min(92vw,520px);background:#05122e;color:var(--ink);border:1px solid var(--line);padding:18px;font-family:var(--ff)}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog img{display:block;width:100%;height:auto;margin:12px 0}
dialog p{margin:0;font-size:.92rem;line-height:1.5;color:var(--mute)}
</style>
</head>
<body>
<main>
 <div class="head"><h1>Bingo dos Mitinhos</h1><p>Calpheon 2026. Clique em qualquer quadrado da imagem para escrever. O texto se ajusta sozinho.</p></div>
 <div class="field"><label for="fam">Nome de família</label><input id="fam" maxlength="40" placeholder="Nome de família" autocomplete="off"></div>
 <div class="frame" id="frame"><div id="stage">
  <img id="base" alt="" style="left:0;top:0;width:2000px;height:2200px">
  <img id="ot" alt="" style="left:900px;top:471px;width:200px;height:67px">
  <img id="ob" alt="" style="left:925px;top:2042px;width:150px;height:42px">
  <div id="ttl"></div>
 </div></div>
 <div class="action"><button id="copy" type="button">Copiar imagem</button><p class="note" id="note" role="status" aria-live="polite"></p></div>
</main>
<dialog id="dlg"><p>Seu navegador não permitiu copiar automaticamente. Pressione e segure a imagem (ou clique com o botão direito) e escolha Copiar imagem.</p><img id="out" alt="Bingo pronto"><button type="button" id="close">Fechar</button></dialog>

const mctx=document.createElement("canvas").getContext("2d");
function wrap(t,size,maxW){mctx.font=FONT(size);const out=[];let line="";
 for(const word of t.split(" ")){if(!word)continue;let cur=word;const test=line?line+" "+cur:cur;
  if(mctx.measureText(test).width<=maxW){line=test;continue}
  if(line){out.push(line);line=""}
  while(mctx.measureText(cur).width>maxW&&cur.length>1){let i=cur.length-1;while(i>1&&mctx.measureText(cur.slice(0,i)).width>maxW)i--;out.push(cur.slice(0,i));cur=cur.slice(i)}
  line=cur}
 if(line)out.push(line);return out}
function fit(t,maxW,maxH){for(let s=MAXF;s>=MINF;s--){const l=wrap(t,s,maxW);if(l.length*s*LH<=maxH)return{s,lines:l}}return{s:MINF,lines:wrap(t,MINF,maxW)}}
function fitLine(t,maxW,max,min){for(let s=max;s>min;s--){mctx.font=FONT(s);if(mctx.measureText(t).width<=maxW)return s}return min}

 try{
  if(!navigator.clipboard||!window.ClipboardItem)throw 0;
  const blob=render().then(c=>new Promise((r,j)=>c.toBlob(b=>b?r(b):j(),"image/png")));
  await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
  say("Imagem copiada. É só colar onde quiser.");
 }catch(e){
  try{const c=await render();$("#out").src=c.toDataURL("image/png");$("#dlg").showModal()}catch(err){say("Não foi possível gerar a imagem.")}
 }
});
$("#close").addEventListener("click",()=>$("#dlg").close());
</script>
</body>
</html>
